# ~/.tmux.conf — managed by prof-workstation (dotfiles/tmux.conf).
# Needs tmux ≥ 3.2 (3.3+ for allow-passthrough).  Reload: prefix r.
# Quick reference at the end of this file.

# ── Prefix: C-z instead of C-b ────────────────────────────────────────
# C-b is Emacs's backward-char (and the shell's), so the default prefix
# collides with every Emacs session inside tmux.  C-z only suspends a job
# (shell) or a frame (Emacs) — rarely wanted — and a double tap still
# sends it: C-z C-z suspends the foreground program as before.
unbind C-b
set -g prefix C-z
bind C-z send-prefix

# ── Terminal capabilities ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# True colour for every xterm-like outer terminal (iTerm2 sends
# xterm-256color, Ghostty xterm-ghostty).
set -as terminal-features ',xterm*:RGB'

# Forward Shift/Ctrl/Alt-modified keys (Shift+Enter, Shift+Tab, etc.) to
# programs running inside tmux instead of collapsing them to the bare key.
# Without this, apps like `claude` can't tell Shift+Enter from Enter.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Required for iTerm2 image rendering (imgcat, icat) inside tmux.
set-option -g allow-passthrough on

# Copying in tmux (copy mode or mouse) also sets the clipboard of the
# machine you are sitting at, even over ssh (OSC 52; Ghostty allows it
# by default, iTerm2 needs "Applications in terminal may access clipboard").
set -s set-clipboard on

# Pass focus in/out events through (Emacs and editors use them).
set -g focus-events on

# No lag after Escape — Meta is Escape-prefixed, so this matters for Emacs.
set -sg escape-time 10

set -g history-limit 50000

# Outer terminal tab/window title: session:window — host.
set -g set-titles on
set -g set-titles-string '#S:#W — #h'

# ── Emacs keys in copy mode and at the command prompt ─────────────────
# (tmux picks vi keys if $EDITOR or $VISUAL mentions vi; pin it.)
set -g mode-keys emacs
set -g status-keys emacs

# ── Windows and panes ─────────────────────────────────────────────────
# Numbering from 1 (matches the keyboard), no gaps after closing one.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Size each window to the smallest client actually looking at it.
setw -g aggressive-resize on

# Closing the last window of a session switches to another session
# instead of detaching.
set -g detach-on-destroy off

# Messages and pane numbers (prefix q) stay up long enough to read.
set -g display-time 2000
set -g display-panes-time 2000

set -g mouse on

# Splits and new windows start in the current pane's directory.
# | and - are mnemonic; the defaults % and " keep working.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config with prefix r.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Status bar ────────────────────────────────────────────────────────
# Minimal: session on the left, windows in the middle, host and time on
# the right.  A reversed PREFIX tag shows while tmux is waiting for the
# key after the prefix — handy while learning.
set -g status-interval 5
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 30
set -g status-left '#[bold] #S #[nobold]│ '
set -g status-right '#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#h  %H:%M '
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-current-style 'fg=colour231,bg=colour238,bold'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour75'
set -g message-style 'bg=colour238,fg=colour231'

# ── Quick reference (prefix = C-z) ────────────────────────────────────
# Sessions   tmux new -A -s NAME   attach to NAME, creating it if needed
#            prefix d   detach          prefix s   pick session/window
#            prefix $   rename session  prefix (/) previous/next session
# Windows    prefix c   new             prefix ,   rename
#            prefix 1…9 go to N         prefix n/p next/previous
#            prefix w   pick from list  prefix &   close
# Panes      prefix | / -  split side by side / stacked
#            prefix ←↑↓→   move         prefix C-←↑↓→ resize (repeatable)
#            prefix z   zoom (toggle)   prefix x   close
#            prefix q N jump to pane N  prefix !   pane → own window
# Copy       prefix [   enter copy mode (Emacs keys; C-s search),
#            C-SPC mark, M-w copy (→ local clipboard), q quit
#            prefix ]   paste           mouse drag selects and copies
#            Shift+drag (Ghostty) / Option+drag (iTerm2) bypasses tmux
#            and uses the terminal's own selection.
# Help       prefix ?   list every binding
