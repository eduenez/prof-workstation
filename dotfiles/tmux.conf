# ~/.tmux.conf

# Required for iTerm2 image rendering (imgcat, icat) inside tmux.
set-option -g allow-passthrough on

# Use 256-colour + true-colour.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Longer history.
set -g history-limit 50000

# Faster key repeat (no delay after Escape).
set -sg escape-time 10

# Forward Shift/Ctrl/Alt-modified keys (Shift+Enter, Shift+Tab, etc.) to
# programs running inside tmux instead of collapsing them to the bare key.
# Without this, apps like `claude` can't tell Shift+Enter from Enter.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Window and pane numbering from 1 (easier keyboard access).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support.
set -g mouse on

# Reload config with prefix-r.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
