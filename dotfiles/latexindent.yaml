# latexindent settings — managed by prof-workstation; do not edit directly.
# Loaded via ~/.indentconfig.yaml (generated by features/04-dotfiles.sh).
#
# `latexindent -w` writes name.bak0, name.bak1, ... on every run, up to
# maxNumberOfBackUps (default 1000), i.e. without bound. Keep a single
# backup, overwritten each run; the files are under git anyway.
onlyOneBackUp: 1
# .bak0 (not the bare .bak) so a `*.bak[0-9]` gitignore pattern covers it.
backupExtension: .bak0
