# ~/.ssh/github.conf — managed by prof-workstation (dotfiles/ssh/github.conf); ~/.ssh/config Includes it.
#
# One authenticated connection to GitHub, shared by every git fetch/clone/push for 10 minutes after the last use.
# Each new ssh connection asks the agent (Bitwarden) for a signature, and a burst of them — VS Code's auto-fetch,
# LaTeX-shared-files' sync-all — can leave requests unanswered: Bitwarden shows one approval and the rest hang with no
# prompt. Sharing the connection turns a burst into one signature (one approval) up front.
#
# Nothing is stored: the shared connection lives only while ssh's master process does (ControlPersist after the last
# client); `ssh -O exit git@github.com` closes it at once. ControlPath must stay under 104 bytes (macOS socket limit).
# Only Control* options here: the agent itself is still chosen by ~/.ssh/config's IdentityAgent rules.

Host github.com
    ControlMaster  auto
    ControlPath    ~/.ssh/cm-%C
    ControlPersist 10m
